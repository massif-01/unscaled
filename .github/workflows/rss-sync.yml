name: Sync Unscaled RSS

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

concurrency:
  group: unscaled-rss-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync RSS feed
        env:
          SITE_URL: ${{ secrets.UNSCALED_SITE_URL }}
          RSS_SYNC_SECRET: ${{ secrets.RSS_SYNC_SECRET }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL"
          test -n "$RSS_SYNC_SECRET"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X POST "$SITE_URL/api/scheduled/sync-rss" \
            -H "x-rss-sync-secret: $RSS_SYNC_SECRET"
